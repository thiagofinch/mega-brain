name: Test

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.claude/**'
      - 'scripts/**'
      - 'bin/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - '.claude/**'
      - 'scripts/**'
      - 'bin/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'

jobs:
  test:
    # Linux + Windows, no piso do README (3.11, exigido por datetime.UTC) e na
    # versão atual: a release 2.0 quebrou no Windows (fcntl) e no Python < 3.12
    # (f-string com barra invertida).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Só o que a engine exige para importar. Os extras pesados do
        # requirements.txt (torch, pyannote, assemblyai) são opcionais e
        # ficam fora de propósito: o import não pode depender deles.
        run: pip install "PyYAML>=6.0" "transitions>=0.9.0" pytest

      - name: Engine imports (static + smoke)
        # Fail-closed: sintaxe inválida, import de módulo inexistente ou
        # módulo de engine/ que não importa com as dependências mínimas.
        # Pacote de terceiros ausente (ex.: numpy da voz) só é listado.
        run: python scripts/check_engine_imports.py

      - name: Install voice base dependencies
        # Os testes de engine/jarvis/voice cobrem o import sem os extras
        # (anthropic, sounddevice, elevenlabs, torch), mas com a base da voz.
        run: pip install numpy requests fastapi uvicorn flask

      - name: Run tests
        run: python -m pytest tests/python/ -v --tb=short

  secrets-scan:
    runs-on: ubuntu-latest
    # gitleaks-action Post-step posts a PR summary comment; without write
    # access it crashed "Resource not accessible by integration". gitleaks
    # itself already passed (0 leaks). Grant minimal perms for the comment.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
